# Runs when a version tag (v0.6.0, …) is pushed: checks the code, builds an
# installable Android APK on EAS (profile "preview") and publishes a GitHub
# release with the CHANGELOG section and the APK link.
# Needs the EXPO_TOKEN repository secret.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { found = 1; next }
            found && (/^---/ || /^## \[/) { exit }
            found { print }
          ' docs/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::docs/CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - run: npm run check

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK on EAS
        run: |
          eas build --platform android --profile preview --non-interactive --json > build.json
          APK_URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          printf '\n### Descarga\n\n- [APK para Android](%s)\n' "$APK_URL" >> notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
